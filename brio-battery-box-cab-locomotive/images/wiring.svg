<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Locomotive wiring (batteries out while you work on it)</text>

  <!-- ===== wires (drawn first, parts on top) ===== -->
  <!-- battery + : holder red to joint J1, white lead up to switch tab -->
  <path d="M200,325 H260" stroke="#d62828" stroke-width="5" fill="none"/>
  <path d="M260,325 H320 V150" stroke="#777" stroke-width="7" fill="none" stroke-linejoin="round"/>
  <path d="M260,325 H320 V150" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round"/>

  <!-- switched + : second switch tab, white lead down to joint J2, red stub to the big plug -->
  <path d="M560,150 V325" stroke="#777" stroke-width="7" fill="none"/>
  <path d="M560,150 V325" stroke="#fff" stroke-width="4" fill="none"/>
  <path d="M560,325 H600" stroke="#d62828" stroke-width="5" fill="none"/>

  <!-- battery - : holder black straight to the big plug -->
  <path d="M200,385 H600" stroke="#222" stroke-width="5" fill="none"/>

  <!-- optional LED: + lead to J2, - lead through the resistor to the black wire -->
  <g stroke-dasharray="10 6">
    <path d="M480,150 V325 H560" stroke="#777" stroke-width="7" fill="none" stroke-linejoin="round"/>
    <path d="M400,150 V225" stroke="#777" stroke-width="7" fill="none"/>
    <path d="M400,305 V385" stroke="#555" stroke-width="3" fill="none"/>
  </g>
  <path d="M480,150 V325 H560" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-dasharray="10 6"/>
  <path d="M400,150 V225" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="10 6"/>
  <!-- resistor -->
  <path d="M400,225 V235 L388,242 L412,252 L388,262 L412,272 L388,282 L412,292 L400,298 V305" stroke="#222" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="418" y="262" fill="#222" font-weight="bold">220 Ω</text>
  <text x="418" y="280" fill="#555" font-size="12">100 Ω</text>
  <text x="418" y="295" fill="#555" font-size="12">if NiMH</text>

  <!-- conversion wire to the motor -->
  <path d="M660,325 H780" stroke="#d62828" stroke-width="4" fill="none"/>
  <path d="M660,385 H780" stroke="#222" stroke-width="4" fill="none"/>

  <!-- ===== parts ===== -->
  <!-- battery holder -->
  <rect x="40" y="290" width="160" height="130" rx="8" fill="#3a3a3a"/>
  <text x="120" y="330" text-anchor="middle" fill="#fff" font-weight="bold">2×AAA holder</text>
  <text x="120" y="350" text-anchor="middle" fill="#ddd" font-size="12">its own slide switch</text>
  <text x="120" y="366" text-anchor="middle" fill="#ddd" font-size="12">stays ON</text>
  <text x="188" y="318" text-anchor="end" fill="#ff6b6b" font-weight="bold">+</text>
  <text x="188" y="400" text-anchor="end" fill="#fff" font-weight="bold">−</text>

  <!-- button, seen from below -->
  <rect x="290" y="55" width="300" height="85" rx="10" fill="#2b2b2b"/>
  <text x="440" y="90" text-anchor="middle" fill="#fff" font-weight="bold">16 mm button (seen from below)</text>
  <text x="440" y="110" text-anchor="middle" fill="#ddd" font-size="12">inside the smoke stack</text>
  <g fill="#c0c0c0" stroke="#888">
    <rect x="313" y="138" width="14" height="16"/>
    <rect x="393" y="138" width="14" height="16"/>
    <rect x="473" y="138" width="14" height="16"/>
    <rect x="553" y="138" width="14" height="16"/>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="320" y="172" transform="rotate(-90 320 172)" text-anchor="end">switch</text>
    <text x="560" y="172" transform="rotate(-90 560 172)" text-anchor="end">switch</text>
  </g>
  <text x="393" y="172" font-size="13" fill="#555" font-weight="bold" text-anchor="end">LED −</text>
  <text x="488" y="172" font-size="13" fill="#555" font-weight="bold">LED +</text>

  <!-- big plug pair -->
  <rect x="600" y="300" width="30" height="110" rx="3" fill="#f2f2f2" stroke="#999"/>
  <rect x="630" y="300" width="30" height="110" rx="3" fill="#f2f2f2" stroke="#999"/>
  <text x="630" y="430" text-anchor="middle" fill="#222" font-weight="bold">big plug</text>
  <text x="630" y="447" text-anchor="middle" fill="#555" font-size="12">battery side | conversion wire</text>
  <text x="645" y="463" text-anchor="middle" fill="#555" font-size="12">(runs cab-first? swap the two wires</text>
  <text x="645" y="479" text-anchor="middle" fill="#555" font-size="12">in one half of this plug)</text>

  <!-- tiny plug + motor -->
  <rect x="780" y="312" width="16" height="86" rx="2" fill="#f2f2f2" stroke="#999"/>
  <text x="788" y="290" text-anchor="middle" fill="#222" font-size="12">tiny plug</text>
  <rect x="805" y="295" width="125" height="120" rx="10" fill="#9a9a9a"/>
  <circle cx="867" cy="355" r="32" fill="#c8c8c8" stroke="#555" stroke-width="2"/>
  <text x="867" y="363" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">M</text>
  <text x="867" y="436" text-anchor="middle" fill="#222" font-weight="bold">N20 motor</text>

  <!-- joints -->
  <g fill="#ffd166" stroke="#222" stroke-width="1.5">
    <circle cx="260" cy="325" r="7"/>
    <circle cx="560" cy="325" r="7"/>
    <circle cx="400" cy="385" r="7"/>
  </g>
  <text x="212" y="350" fill="#222" font-size="12">joint 1: holder red</text>
  <text x="212" y="366" fill="#222" font-size="12">→ white lead</text>
  <text x="572" y="270" fill="#222" font-size="12">joint 2: white lead → red stub</text>
  <text x="572" y="286" fill="#555" font-size="12">(LED + joins here too)</text>
  <text x="400" y="412" fill="#222" font-size="12" text-anchor="middle">joint 3 (LED only): strip 5 mm of the black wire,</text>
  <text x="400" y="428" fill="#222" font-size="12" text-anchor="middle">wrap the resistor leg round it</text>

  <!-- legend -->
  <g font-size="13" fill="#222">
    <line x1="40" y1="500" x2="80" y2="500" stroke="#d62828" stroke-width="5"/>
    <text x="88" y="505">battery + (switched by the button)</text>
    <line x1="330" y1="500" x2="370" y2="500" stroke="#222" stroke-width="5"/>
    <text x="378" y="505">battery −</text>
    <line x1="480" y1="500" x2="520" y2="500" stroke="#777" stroke-width="7"/>
    <line x1="480" y1="500" x2="520" y2="500" stroke="#fff" stroke-width="4"/>
    <text x="528" y="505">quick-connect leads</text>
    <line x1="700" y1="500" x2="740" y2="500" stroke="#777" stroke-width="7" stroke-dasharray="10 6"/>
    <text x="748" y="505">optional LED</text>
    <circle cx="60" cy="532" r="7" fill="#ffd166" stroke="#222" stroke-width="1.5"/>
    <text x="88" y="537">solder, then cover with melted PLA. Keep joints from touching each other.</text>
  </g>
</svg>
